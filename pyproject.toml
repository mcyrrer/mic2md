[project]
name = "mic2md"
version = "0.1.0"
description = "Real-time voice-to-text CLI with Whisper and Ollama-polished Markdown output"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pywhispercpp>=1.3",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "rich>=13.7",
    "httpx>=0.27",
    "typer>=0.12",
    "pyobjc-framework-eventkit>=10 ; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/mcyrrer/McVoice2Text"

[project.scripts]
mic2md = "mic2md.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mic2md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
